name: CI - PhoneStore

# Integración continua del proyecto.
#
# Se ejecuta en cada push y en cada pull request sobre las ramas
# principales, y comprueba tres cosas:
#
#   1. Backend  -> que pasan las pruebas de Pytest, y que instala,
#                  compila y arranca contra una base de datos real
#                  superando las pruebas de punta a punta.
#   2. Frontend -> que pasa ESLint sin errores y que compila para
#                  producción.
#   3. Base de datos -> que el script database/phonestore.sql se ejecuta
#                  de principio a fin sobre un MySQL limpio.
#
# Si algo falla, GitHub marca el commit en rojo y no se puede fusionar.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  # ===============================================================
  # 1. Base de datos + backend + pruebas de la API
  # ===============================================================
  backend:
    name: Backend (FastAPI) y pruebas de la API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phonestore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: phonestore
      JWT_SECRET: clave_solo_para_integracion_continua_no_usar_en_produccion
      JWT_EXPIRES_IN: 1d
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      RATE_LIMIT_ENABLED: "false"
      ADMIN_NOMBRE: Admin
      ADMIN_APELLIDO: CI
      ADMIN_EMAIL: admin@phonestore.com
      ADMIN_PASSWORD: Admin1234
      ADMIN_DOCUMENTO: "1000000000"
      ADMIN_TELEFONO: "3000000000"
      ADMIN_DIRECCION: Oficina principal calle 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proyecto-react/backend-fastapi/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: proyecto-react/backend-fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear el esquema de la base de datos
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < proyecto-react/database/phonestore.sql
          echo "Tablas creadas:"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -D phonestore -e "SHOW TABLES;"

      - name: Verificar que los módulos del backend importan
        working-directory: proyecto-react/backend-fastapi
        run: python -c "from app.main import app; print('Rutas registradas:', len(app.routes))"

      # Estas no necesitan la base de datos ni el servidor: usan SQLite y
      # TestClient. Si fallan, no tiene sentido seguir con el resto.
      - name: Ejecutar las pruebas unitarias (Pytest)
        working-directory: proyecto-react/backend-fastapi
        run: pytest

      - name: Crear el administrador y el catálogo de ejemplo
        working-directory: proyecto-react/backend-fastapi
        run: |
          python -m app.scripts.seed_admin
          python -m app.scripts.seed_demo

      - name: Levantar la API
        working-directory: proyecto-react/backend-fastapi
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 3000 > servidor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "API lista"; exit 0
            fi
            sleep 1
          done
          echo "La API no respondió a tiempo"; cat servidor.log; exit 1

      - name: Ejecutar las pruebas de la API
        working-directory: proyecto-react/backend-fastapi
        env:
          ADMIN_EMAIL_TEST: admin@phonestore.com
          ADMIN_PASSWORD_TEST: Admin1234
        run: python -m tests.pruebas_api

      - name: Guardar la evidencia de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pruebas-api
          path: |
            proyecto-react/backend-fastapi/tests/evidencia_pruebas_api.md
            proyecto-react/backend-fastapi/tests/evidencia_pruebas_api.json
            proyecto-react/backend-fastapi/servidor.log

  # ===============================================================
  # 2. Frontend: linter y compilación
  # ===============================================================
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: proyecto-react/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: proyecto-react/frontend
        run: npm ci

      - name: Revisar el código con ESLint
        working-directory: proyecto-react/frontend
        run: npm run lint

      - name: Compilar para producción
        working-directory: proyecto-react/frontend
        env:
          VITE_API_URL: http://localhost:3000/api
        run: npm run build

      - name: Guardar la compilación
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: proyecto-react/frontend/dist
          retention-days: 7

  # ===============================================================
  # 3. Revisión de seguridad básica
  # ===============================================================
  seguridad:
    name: Revisión de seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Comprobar que no se suben archivos .env
        run: |
          encontrados=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$encontrados" ]; then
            echo "Hay archivos .env versionados, y no deberían estarlo:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK: ningún archivo .env está versionado."

      - name: Buscar credenciales escritas en el código
        run: |
          patron='(JWT_SECRET|DB_PASSWORD|SMTP_PASSWORD|IA_API_KEY)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']{6,}'
          hallazgos=$(grep -rInE "$patron" \
            --include='*.py' --include='*.js' --include='*.jsx' \
            proyecto-react/backend-fastapi/app proyecto-react/frontend/src || true)
          if [ -n "$hallazgos" ]; then
            echo "Hay credenciales escritas directamente en el código:"
            echo "$hallazgos"
            exit 1
          fi
          echo "OK: las credenciales se leen de variables de entorno."

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: proyecto-react/frontend/package-lock.json

      - name: Auditar dependencias del frontend
        working-directory: proyecto-react/frontend
        run: npm audit --audit-level=high || echo "Revisar el informe de npm audit"
