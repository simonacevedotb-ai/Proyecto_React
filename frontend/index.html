<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="PhoneStore: celulares, accesorios y servicio técnico especializado. Equipos originales con garantía de 12 meses y envío a todo el país."
    />

    <!-- Roboto: la tipografía del diseño. Se precarga la conexión para
         que el texto aparezca sin salto perceptible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <title>PhoneStore — Celulares, accesorios y servicio técnico</title>

    <style>
      /* Fondo negro desde el primer píxel pintado: evita el destello
         blanco entre que carga el HTML y arranca React. */
      html, body, #root { background: #000; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
